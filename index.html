<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>
<style>
  :root{
    --bg1:#1b1530;
    --bg2:#2d1f4a;
    --accent:#7c4dff;
    --accent2:#00e0c6;
    --card:#231a3d;
    --text:#f1edff;
    --muted:#a99bd4;
    --good:#2ee6a8;
    --bad:#ff5d7a;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--font-body);
    background:radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1) 60%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  @font-face{font-family:'Sora';src:local('Sora');}
  .app{
    width:100%;
    max-width:640px;
    background:var(--card);
    border-radius:24px;
    padding:32px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    position:relative;
    overflow:hidden;
    animation:rise .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(24px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .app::before{
    content:'';
    position:absolute;
    top:-120px;right:-120px;
    width:280px;height:280px;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:.35;
    filter:blur(10px);
    pointer-events:none;
  }
  h1{
    font-family:var(--font-display);
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.02em;
  }
  .sub{color:var(--muted); margin-bottom:24px; font-size:14px;}

  /* START SCREEN */
  .field{margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  input[type=text], select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(124,77,255,0.2);
  }
  .btn{
    width:100%;
    padding:14px 18px;
    border-radius:14px;
    border:none;
    background:linear-gradient(135deg, var(--accent), #5a35d6);
    color:#fff;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s, filter .15s;
    font-family:var(--font-body);
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px -8px rgba(124,77,255,0.6);}
  .btn:active{transform:translateY(0px) scale(.99);}
  .btn.secondary{
    background:rgba(255,255,255,0.06);
    color:var(--text);
    margin-top:10px;
  }
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  /* QUIZ SCREEN */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-size:14px;
    color:var(--muted);
  }
  .timer{
    font-family:var(--font-display);
    font-weight:600;
    font-size:18px;
    color:var(--accent2);
    transition:color .3s;
  }
  .timer.warning{color:var(--bad); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .progress-track{
    width:100%;
    height:6px;
    border-radius:6px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
    margin-bottom:24px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    width:0%;
    transition:width .4s cubic-bezier(.2,.8,.2,1);
    border-radius:6px;
  }

  .qcard{animation:slideIn .35s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideIn{
    from{opacity:0; transform:translateX(24px);}
    to{opacity:1; transform:translateX(0);}
  }
  .qtext{
    font-size:18px;
    font-weight:600;
    margin-bottom:18px;
    line-height:1.4;
  }
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    transition:all .15s;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .option:hover{border-color:var(--accent); background:rgba(124,77,255,0.08); transform:translateX(4px);}
  .option.selected{border-color:var(--accent); background:rgba(124,77,255,0.16); box-shadow:0 0 0 1px var(--accent);}
  .option .letter{
    width:26px;height:26px;border-radius:8px;
    background:rgba(255,255,255,0.06);
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:600; color:var(--muted);
    flex-shrink:0;
    transition:all .15s;
  }
  .option.selected .letter{background:var(--accent); color:#fff;}

  .nav{display:flex; gap:10px; margin-top:24px;}
  .nav .btn{width:auto; flex:1;}

  /* RESULT SCREEN */
  .result-hero{text-align:center; padding:10px 0 20px;}
  .score-ring{
    width:140px;height:140px;
    margin:0 auto 16px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:conic-gradient(var(--accent2) calc(var(--pct,0)*1%), rgba(255,255,255,0.06) 0);
    animation:ringIn 1s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ringIn{from{filter:blur(6px); opacity:0; transform:scale(.7);} to{filter:blur(0); opacity:1; transform:scale(1);}}
  .score-ring::before{
    content:'';
    position:absolute; inset:8px;
    border-radius:50%;
    background:var(--card);
  }
  .score-num{
    position:relative; z-index:1;
    font-family:var(--font-display);
    font-size:32px; font-weight:700;
  }
  .result-title{font-family:var(--font-display); font-size:22px; margin:0 0 6px;}
  .result-sub{color:var(--muted); font-size:14px; margin-bottom:24px;}

  .hidden{display:none !important;}

  .confetti{
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:5; overflow:hidden;
  }
  .confetti span{
    position:absolute; top:-10px;
    width:8px;height:14px;
    opacity:.9;
    animation:fall linear forwards;
    border-radius:2px;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:0;}
  }

  .loader{
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:var(--muted); font-size:14px; padding:30px 0;
  }
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--accent2);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{
    background:rgba(255,93,122,0.1);
    border:1px solid rgba(255,93,122,0.3);
    color:#ffb3c0;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    margin-top:12px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- START SCREEN -->
  <div id="screen-start">
    <h1>Тест</h1>
    <p class="sub" id="start-sub">Загрузка вопросов из базы…</p>

    <div class="field">
      <label for="fio">Фамилия и имя</label>
      <input type="text" id="fio" placeholder="Иванов Иван" autocomplete="off">
    </div>

    <div class="field">
      <label for="qcount">Количество вопросов</label>
      <select id="qcount">
        <option value="30">30 вопросов</option>
        <option value="all">Все вопросы</option>
      </select>
    </div>

    <button class="btn" id="btn-start" disabled>Загрузка…</button>
    <div id="start-error" class="error-box hidden"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="topbar">
      <span id="q-position">Вопрос 1 из 30</span>
      <span class="timer" id="timer">30:00</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="qcard" id="qcard">
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
    </div>

    <div class="nav">
      <button class="btn secondary" id="btn-prev">Назад</button>
      <button class="btn" id="btn-next">Далее</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="hidden">
    <div class="result-hero">
      <div class="score-ring" id="score-ring" style="--pct:0">
        <div class="score-num" id="score-num">0%</div>
      </div>
      <h2 class="result-title" id="result-title">Тест завершён</h2>
      <p class="result-sub" id="result-sub"></p>
    </div>
  </div>

</div>

<div class="confetti" id="confetti"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
